name: Check

# Runs the repository's own check on every proposed change.
# It cannot look for private project names: that list never leaves a
# contributor's machine, so contributors run the full check locally.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # Pinned to an exact commit, so a moved or replaced tag cannot change
      # what runs here. To update, look up the commit of a newer release.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Skill shape, project leftovers and hidden content
        run: bash scripts/check.sh --no-private-terms
      - name: The hidden-content check still catches known tricks
        run: bash scripts/check.sh --self-test
